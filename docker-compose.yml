services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticoncloud
    volumes:
      - ticoncloud-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticoncloud"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  ticoncloud-pgdata:
