AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TiCON Cloud service control policies (Sections 3.1, 6.3, 15 item 13). Applied by DevOps in the
  MANAGEMENT account, in us-east-1, after accounts-and-ous.yaml. Three policies:
  guardrails (all member OUs), pool allow-list (pool OUs), dns allow-list (the DNS OU).
  An SCP never applies to the management account itself. An SCP also binds the root user and every
  admin role of a member account, so each allow-list lets one named admin role keep its IAM, Service
  Quotas and support-case work (6.3).
# VERIFY: before attaching the pool and dns SCPs, in tc-pool-dev with the SCPs attached: TcProvisioner
# can create an instance and a bucket; the admin role can list and file a quota increase; a denied
# action (for example ec2:RunInstances) is refused. Record the final policy JSON next to this file.
# VERIFY: each SCP document is at most 5,120 characters (AWS limit); check the size after Fn::Sub.
# VERIFY: AWS::Organizations::Policy with Type SERVICE_CONTROL_POLICY and TargetIds is deployed from
# the management account in us-east-1.

Parameters:
  GuardrailTargetIds:
    Type: CommaDelimitedList
    Description: OU ids (ou-xxxx-xxxxxxxx) that get the guardrails. All six OUs of accounts-and-ous.yaml.
  PoolTargetIds:
    Type: CommaDelimitedList
    Description: OU ids of TiCON-Pools and TiCON-Pools-Dev.
  DnsTargetIds:
    Type: CommaDelimitedList
    Description: OU id of TiCON-Dns.
  AdminRoleArnPattern:
    Type: String
    Default: "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_TcOrgAdmin_*"
    Description: >-
      The one named admin role that may change the Tc roles, file quota increases and support cases
      in a member account (IAM Identity Center permission set TcOrgAdmin). VERIFY the exact ARN
      form of the permission set role in a member account.
  StackSetRoleArnPattern:
    Type: String
    Default: "arn:aws:iam::*:role/AWSCloudFormationStackSetExecutionRole"
    Description: Execution role of CloudFormation StackSets, if DevOps deploys pool-roles.yaml that way.

Resources:
  GuardrailsPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: ticon-guardrails
      Description: Leave, audit services, Regions, long-lived keys, root user, the SCPs themselves.
      Type: SERVICE_CONTROL_POLICY
      TargetIds:
        Ref: GuardrailTargetIds
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyLeavingTheOrganization
            Effect: Deny
            Action:
              - organizations:LeaveOrganization
            Resource: "*"
          - Sid: DenyDisablingAuditServices
            Effect: Deny
            Action:
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:PutEventSelectors
              - cloudtrail:PutInsightSelectors
              - guardduty:DeleteDetector
              - guardduty:UpdateDetector
              - guardduty:DisassociateFromMasterAccount
              - guardduty:DisassociateFromAdministratorAccount
              - guardduty:DeleteMembers
              - guardduty:DisassociateMembers
              - guardduty:StopMonitoringMembers
              - config:DeleteConfigurationRecorder
              - config:StopConfigurationRecorder
              - config:DeleteDeliveryChannel
              - config:PutConfigurationRecorder
            Resource: "*"
          - Sid: DenyRegionsThatAreNotApproved
            Effect: Deny
            NotAction:
              - account:*
              - budgets:*
              - ce:*
              - cloudfront:*
              - health:*
              - iam:*
              - organizations:*
              - pricing:*
              - route53:*
              - route53domains:*
              - sts:*
              - support:*
              - trustedadvisor:*
              - waf:*
              - wafv2:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion:
                  - ap-southeast-1
                  - ap-south-1
                  - us-east-1
          - Sid: DenyLongLivedKeysAndPasswords
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:CreateServiceSpecificCredential
              - iam:ResetServiceSpecificCredential
            Resource: "*"
          - Sid: DenyRootUserActions
            Effect: Deny
            Action: "*"
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn: "arn:aws:iam::*:root"
          - Sid: ProtectTheServiceControlPolicies
            Effect: Deny
            Action:
              - organizations:AttachPolicy
              - organizations:CreatePolicy
              - organizations:DeletePolicy
              - organizations:DetachPolicy
              - organizations:DisablePolicyType
              - organizations:EnablePolicyType
              - organizations:UpdatePolicy
              - organizations:MoveAccount
              - organizations:RemoveAccountFromOrganization
              - organizations:DeleteOrganizationalUnit
              - organizations:UpdateOrganizationalUnit
            Resource: "*"

  PoolAllowListPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: ticon-pool-lightsail-only
      Description: Pool accounts. Lightsail only, plus the minimum read-only and support actions (6.3).
      Type: SERVICE_CONTROL_POLICY
      TargetIds:
        Ref: PoolTargetIds
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyEverythingExceptLightsailAndSupport
            Effect: Deny
            NotAction:
              - lightsail:*
              - ce:GetCostAndUsage
              - support:*
              - servicequotas:*
              - health:Describe*
              - cloudtrail:LookupEvents
              - cloudformation:*
              - iam:*
              - sts:*
              - account:GetAlternateContact
            Resource: "*"
          - Sid: ProtectTheTcRoles
            Effect: Deny
            Action:
              - iam:AttachRolePolicy
              - iam:DeleteRole
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
            Resource: "arn:aws:iam::*:role/Tc*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - Ref: AdminRoleArnPattern
                  - Ref: StackSetRoleArnPattern
          - Sid: ProtectTheTcPermissionsBoundary
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
            Resource: "arn:aws:iam::*:policy/TcPoolPermissionsBoundary"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - Ref: AdminRoleArnPattern
                  - Ref: StackSetRoleArnPattern

  DnsAllowListPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: ticon-dns-route53-only
      Description: tc-dns. Route 53 and Route 53 Domains only, plus the minimum read-only and support actions (6.3).
      Type: SERVICE_CONTROL_POLICY
      TargetIds:
        Ref: DnsTargetIds
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyEverythingExceptRoute53AndSupport
            Effect: Deny
            NotAction:
              - route53:*
              - route53domains:*
              - ce:GetCostAndUsage
              - support:*
              - servicequotas:*
              - health:Describe*
              - cloudtrail:LookupEvents
              - cloudformation:*
              - iam:*
              - sts:*
              - account:GetAlternateContact
            Resource: "*"
          - Sid: ProtectTheTcRoles
            Effect: Deny
            Action:
              - iam:AttachRolePolicy
              - iam:DeleteRole
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
            Resource: "arn:aws:iam::*:role/Tc*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - Ref: AdminRoleArnPattern
                  - Ref: StackSetRoleArnPattern

Outputs:
  GuardrailsPolicyId:
    Value:
      Ref: GuardrailsPolicy
  PoolAllowListPolicyId:
    Value:
      Ref: PoolAllowListPolicy
  DnsAllowListPolicyId:
    Value:
      Ref: DnsAllowListPolicy
