name: Bug report
description: Something does not work as the documentation or the code says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. **Never paste secrets, AWS account ids, access keys, tokens, customer data or full phone numbers or emails.** Security problems go through a private advisory, not here (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran and their output (redact anything private).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "main at abc1234"
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node 24, pnpm 10, macOS / Linux"
