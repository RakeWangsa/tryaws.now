name: secret-scan

# The secret scan has no paths filter on purpose: a note, a runbook or a draft can hold a secret as well as code
# (security review of ci.yml, 2026-11-15). It is cheap: a pull request or a push reads only its own commits
# (seconds); the whole history is read once a week and by hand. No secret, no AWS role, read-only permission.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          RANGE=""
          if [ -n "$PR_BASE" ]; then
            RANGE="--log-opts=${PR_BASE}..HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE#0000000}" = "$PUSH_BEFORE" ]; then
            RANGE="--log-opts=${PUSH_BEFORE}..HEAD"
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose $RANGE
